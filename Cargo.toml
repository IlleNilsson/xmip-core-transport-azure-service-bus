# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-azure-service-bus"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-service-bus"
description = "Azure Service Bus transport: a Shared Access Signature over the REST API — send a Stream as a message, receive with peek-lock and complete each message once it is a Stream — a queue is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, the request and its answer, percent-encoding, the
# Shared Access Signature, and TLS behind the `tls` feature — one TLS stack
# in the estate, the http technology's (ADR-0033). The signature moved
# there on 2026-09-14, and with it the HMAC-SHA256 and base64 this crate
# carried (ADR-0044).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# BrokerProperties travels as a JSON header, and serde reads it.
serde_json = "1"

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
