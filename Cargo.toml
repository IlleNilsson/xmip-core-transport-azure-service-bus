[package]
name = "xmip-core-transport-azure-service-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-service-bus"
description = "Azure Service Bus transport: a Shared Access Signature over the REST API — send a Stream as a message, receive with peek-lock and complete each message once it is a Stream — a queue is a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The endpoint parser, the request and its answer, and
# TLS behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { workspace = true, optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { workspace = true, optional = true }
# The Shared Access Signature and the judgement of a namespace's answers,
# which this crate carried with its HMAC-SHA256 and base64 until
# 2026-09-14; what Azure speaks is the Azure crate's (ADR-0044, the owner's
# ruling of 2026-09-22). Its declaration alone where this crate is
# (`key_name::key_name`).
azure = { workspace = true, default-features = false }
# BrokerProperties travels as a JSON header, and serde reads it.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# A Location's secret held in memory (`transport::secured::Kept`), from the
# capability's test support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "azure/default", "dep:http", "dep:net", "dep:serde_json"]
# The declaration alone, the Azure crate's `key_name` among its settings.
declaration = ["azure/declaration"]
# HTTPS endpoints: the http technology's `tls`, off by default as there.
tls = ["default", "http/tls"]

[lints]
workspace = true
